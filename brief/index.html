<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; form-action https://formsubmit.co; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your ad brief | Enverse</title>
<meta name="description" content="Tell us about your product so we can plan your ads.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../styles.css?v=20261029d">
</head>
<body>
<header class="nav"><div class="wrap nav-in"><a href="../" class="logo" aria-label="Enverse home"><img src="../assets/logo.svg" alt="enverse, creative agency" class="logo-img" width="156" height="60"></a></div></header>
<main id="main">
<section class="wrap section brief">
  <h2>Your ad brief</h2>
  <p class="sub">Ten minutes now saves days later. We plan every ad around your answers, and we start as soon as this is back.</p>
  <form class="form brief-form" action="https://formsubmit.co/enverse.creative@gmail.com" method="POST" name="brief">
    <input type="hidden" name="_subject" value="New Enverse ad brief">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://enversecreative.com/brief/thanks/">
    <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <fieldset><legend>About you</legend>
      <div class="brief-row">
        <label>Your name<input name="name" required autocomplete="name"></label>
        <label>Company<input name="company" required autocomplete="organization"></label>
      </div>
      <div class="brief-row">
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Website<input type="url" name="website" placeholder="https://" autocomplete="url"></label>
      </div>
      <label>Package you bought<select name="package" required><option value="">Choose one</option><option>Starter, $149</option><option>Growth, $449</option><option>Brand, $995/mo</option></select></label>
    </fieldset>
    <fieldset><legend>About the ad</legend>
      <label>The product to feature<textarea name="product" rows="3" required placeholder="What it is, and what makes it good"></textarea></label>
      <label>Who's the buyer?<textarea name="buyer" rows="3" required placeholder="For example: busy moms, 30 to 45, who shop on Instagram"></textarea></label>
      <label>What should people do after the ad?<select name="action" required><option value="">Choose one</option><option>Buy</option><option>Sign up</option><option>Visit</option></select></label>
      <label>Your offer or key selling points<textarea name="selling_points" rows="3" required></textarea></label>
      <label>Must say<textarea name="must_say" rows="2" placeholder="Taglines, claims or words we have to use"></textarea></label>
      <label>Must avoid<textarea name="must_avoid" rows="2" placeholder="Words, claims or looks that are off limits"></textarea></label>
    </fieldset>
    <fieldset><legend>Your brand</legend>
      <label>Link to your brand assets<input type="url" name="assets_link" required placeholder="Google Drive or Dropbox link: logo, colors, fonts, photos, footage"></label>
      <label>Ad you love #1<input type="url" name="ad_love_1" required placeholder="https://"></label>
      <label>Ad you love #2 (optional)<input type="url" name="ad_love_2" placeholder="https://"></label>
    </fieldset>
    <button class="btn" type="submit">Send my brief</button>
    <p class="brief-note">Please make sure your Drive link is set so anyone with the link can view it.</p>
  </form>
</section>
</main>
<footer class="foot"><div class="wrap nav-in"><span>© <span id="y"></span> Enverse. All rights reserved.</span><span><a href="mailto:hello@enversecreative.com">hello@enversecreative.com</a> <span class="social"><a href="https://www.instagram.com/enverse.creative/" target="_blank" rel="noopener" aria-label="Enverse on Instagram (@enverse.creative)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a><a href="https://www.tiktok.com/@enverse.creative" target="_blank" rel="noopener" aria-label="Enverse on TikTok (@enverse.creative)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.8 2.4 4.6 5 4.8"/></svg></a></span></span></div></footer>
<script src="brief.js?v=20261029d"></script>
</body>
</html>
